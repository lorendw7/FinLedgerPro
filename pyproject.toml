[project]
name = "finledger-pro"
version = "0.0.0"
description = "Free, open-source, local-first accounting core and reference app."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
