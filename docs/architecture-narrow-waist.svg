<svg viewBox="0 0 900 706" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title>FinLedger Pro narrow-waist extensible architecture</title>
  <desc>A personal ledger book and six business subledger modules both post journal entries down into a central accounting kernel (chart of accounts, general ledger, double-entry posting, trial balance), which the reporting and analysis layer reads from. The personal book is never consolidated with the business books. A platform band of cross-cutting capabilities wraps everything.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6E6D67"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="706" fill="#FBFBF9"/>

  <text x="450" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#2C2C2A">FinLedger Pro &#8212; Extensible &#8220;Narrow-Waist&#8221; Design</text>

  <!-- TIER 1a: personal book -->
  <text x="450" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#3B6D11">PERSONAL BOOK &#183; &#20010;&#20154;&#36134;&#22871; &#8212; built first &#183; never consolidated with business</text>
  <rect x="40" y="62" width="820" height="48" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
  <text x="450" y="82"  text-anchor="middle" font-size="13" font-weight="700" fill="#3B6D11">Personal Ledger &#183; &#20010;&#20154;&#35760;&#36134;</text>
  <text x="450" y="99"  text-anchor="middle" font-size="11" fill="#3B6D11">accounts &#183; categories &#183; income / expense / transfer &#183; budgets &#183; spending analysis</text>

  <!-- TIER 1b: business modules -->
  <text x="450" y="134" text-anchor="middle" font-size="12" font-weight="700" fill="#5F5E5A">BUSINESS MODULES &#183; &#19994;&#21153;&#23376;&#36134; &#8212; they POST journal entries</text>

  <!-- row a -->
  <g>
    <rect x="40"  y="144" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="160" y="164" text-anchor="middle" font-size="13" fill="#444441">Revenue &amp; Invoicing</text>
    <text x="160" y="181" text-anchor="middle" font-size="11" fill="#5F5E5A">&#25910;&#20837; &#183; &#24320;&#31080;</text>

    <rect x="330" y="144" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="450" y="164" text-anchor="middle" font-size="13" fill="#444441">Expense &amp; Payables</text>
    <text x="450" y="181" text-anchor="middle" font-size="11" fill="#5F5E5A">&#25903;&#20986; &#183; &#24212;&#20184;</text>

    <rect x="620" y="144" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="740" y="164" text-anchor="middle" font-size="13" fill="#444441">Payroll &#183; piece-rate</text>
    <text x="740" y="181" text-anchor="middle" font-size="11" fill="#5F5E5A">&#34218;&#37228; &#183; &#21171;&#21153;&#35745;&#20214;</text>
  </g>
  <!-- row b -->
  <g>
    <rect x="40"  y="198" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="160" y="218" text-anchor="middle" font-size="13" fill="#444441">Cost &amp; Inventory</text>
    <text x="160" y="235" text-anchor="middle" font-size="11" fill="#5F5E5A">&#25104;&#26412; &#183; &#23384;&#36135;</text>

    <rect x="330" y="198" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="450" y="218" text-anchor="middle" font-size="13" fill="#444441">Fixed Assets</text>
    <text x="450" y="235" text-anchor="middle" font-size="11" fill="#5F5E5A">&#22266;&#23450;&#36164;&#20135; &#183; &#25240;&#26087;</text>

    <rect x="620" y="198" width="240" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="740" y="218" text-anchor="middle" font-size="13" fill="#444441">Bank &amp; Cash</text>
    <text x="740" y="235" text-anchor="middle" font-size="11" fill="#5F5E5A">&#36164;&#37329; &#183; &#23545;&#36134;</text>
  </g>

  <!-- arrow down to core -->
  <line x1="450" y1="250" x2="450" y2="286" stroke="#6E6D67" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="272" font-size="11" font-style="italic" fill="#5F5E5A">post &#20511;/&#36151; entries</text>

  <!-- CORE (the waist) -->
  <rect x="150" y="292" width="600" height="118" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="2.5"/>
  <text x="450" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#0C447C">ACCOUNTING KERNEL &#183; &#20250;&#35745;&#20869;&#26680;  (the narrow waist)</text>
  <text x="450" y="342" text-anchor="middle" font-size="12" fill="#185FA5">Books &#183; Chart of Accounts &#183; General Ledger &#183; Double-entry posting (&#20511; = &#36151;) &#183; Trial Balance</text>
  <rect x="172" y="362" width="556" height="34" rx="6" fill="#B5D4F4"/>
  <text x="450" y="384" text-anchor="middle" font-size="11" fill="#0C447C">SQLite local file &#183; Decimal money &#183; immutable audit trail &#183; ACID transactions</text>

  <!-- arrow down to reports -->
  <line x1="450" y1="410" x2="450" y2="446" stroke="#6E6D67" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="432" font-size="11" font-style="italic" fill="#5F5E5A">read ledger</text>

  <!-- TIER 3: reporting -->
  <text x="450" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#5F5E5A">REPORTING &amp; ANALYSIS &#183; &#25253;&#34920;&#20998;&#26512; &#8212; they READ the ledger</text>
  <g>
    <rect x="40"  y="476" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="135" y="496" text-anchor="middle" font-size="13" fill="#444441">3 Statements</text>
    <text x="135" y="513" text-anchor="middle" font-size="11" fill="#5F5E5A">&#19977;&#22823;&#25253;&#34920;</text>

    <rect x="250" y="476" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="345" y="496" text-anchor="middle" font-size="13" fill="#444441">Dashboards / KPIs</text>
    <text x="345" y="513" text-anchor="middle" font-size="11" fill="#5F5E5A">&#32463;&#33829;&#30475;&#26495;</text>

    <rect x="460" y="476" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="555" y="496" text-anchor="middle" font-size="13" fill="#444441">AI Analysis</text>
    <text x="555" y="513" text-anchor="middle" font-size="11" fill="#5F5E5A">AI &#20998;&#26512; (LangGraph)</text>

    <rect x="670" y="476" width="190" height="48" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
    <text x="765" y="496" text-anchor="middle" font-size="13" fill="#444441">Export</text>
    <text x="765" y="513" text-anchor="middle" font-size="11" fill="#5F5E5A">Excel &#183; PDF &#23548;&#20986;</text>
  </g>

  <!-- PLATFORM band -->
  <text x="450" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#5F5E5A">PLATFORM (cross-cutting) &#183; &#24179;&#21488;&#27178;&#20999;&#33021;&#21147;</text>
  <rect x="40" y="566" width="820" height="64" rx="8" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="450" y="590" text-anchor="middle" font-size="12" fill="#2C2C2A">Multi-book &amp; multi-entity (personal / SG / CN) &#183; Multi-currency &#183; Tax config (&#20165;&#21442;&#32771;)</text>
  <text x="450" y="612" text-anchor="middle" font-size="12" fill="#2C2C2A">Backup &amp; restore &#183; Security / encryption &#183; Import/Export &#183; Configurable rates</text>

  <!-- legend -->
  <rect x="120" y="656" width="16" height="16" rx="3" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
  <text x="144" y="669" font-size="11" fill="#5F5E5A">Personal book &#8212; separate, built first</text>

  <rect x="380" y="656" width="16" height="16" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
  <text x="404" y="669" font-size="11" fill="#5F5E5A">Stable core &#8212; rarely changes</text>

  <rect x="620" y="656" width="16" height="16" rx="3" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1.5"/>
  <text x="644" y="669" font-size="11" fill="#5F5E5A">Pluggable module &#8212; add freely</text>
</svg>
